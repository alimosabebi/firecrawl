
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3002:8080'
    environment:
      PORT: 8080
      REDIS_URL: 'redis://redis:6379'
      REDIS_RATE_LIMIT_URL: 'redis://redis:6379'
      PLAYWRIGHT_MICROSERVICE_URL: 'http://worker:3002'
    depends_on:
      - redis
      - worker

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: 'pnpm run worker'
    environment:
      REDIS_URL: 'redis://redis:6379'
      PLAYWRIGHT_MICROSERVICE_URL: 'http://worker:3002'
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  playwright:
    image: browserless/chrome:latest
    shm_size: 1gb
